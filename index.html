<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feliz Cumpleaños ✨</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="birthday" id="birthday">
        <div class="castle-background">

            <!-- Luna -->
            <div class="moon"></div>
            <!-- Castillo -->
            <div class="castle">
                <!-- TORRE IZQUIERDA -->
                <div class="tower tower-left">
                    <div class="roof"></div>
                    <div class="window"></div>
                </div>

                <!-- TORRE CENTRAL -->
                <div class="tower tower-center">
                    <div class="roof"></div>
                    <div class="window"></div>
                </div>

                <!-- TORRE DERECHA -->
                 <div class="tower tower-right">
                    <div class="roof"></div>
                    <div class="window"></div>
                </div>


                <!-- CUERPO PRINCIPAL DEL CASTILLO -->
                <div class="castle-main">
                    <div class="castle-door"></div>
                </div>
            </div>
        </div>

 <!--ESTRELLAS  -->
        <div
            class="stars"
            id="stars"
        ></div>



        <!-- =====================================
             FOTO DE LA PERSONA
        ====================================== -->

        <div class="princess-container">

            <div class="photo-glow"></div>

            <img
                src="img/persona.jpg"
                alt="Foto de cumpleaños"
                class="princess-photo"
            >

        </div>



        <!-- =====================================
             LOADER
        ====================================== -->

        <section
            class="intro"
            id="intro"
        >
            <!-- Corona de princesa ? no se como hacer esa cochinada -->
            <div class="crown">
                ♛
            </div>
            <!-- Texto pequeño -->
            <p class="subtitle">
                HOY ES UN DÍA MÁGICO
            </p>
            <!-- Título principal -->
            <h1>
                <span>Feliz</span>
                <span>Cumpleaños</span>
            </h1>
            <!-- Mensaje -->
            <p class="message">
                Que tu dia esté lleno de magia
            </p>
Q

            <!-- Indicador -->
            <div class="continue">
              <span>Haz clic o desliza</span>
                <div class="arrow">
                    ↓
                </div>
            </div>
        </section>



        <!-- =====================================
             MENSAJE FINAL
        ====================================== -->

        <section
            class="final-message"
            id="finalMessage"
        >
            <p>
                ✨ Que todos tus sueños se hagan realidad ✨
            </p>

        </section>


    </main>


    <!-- JavaScript -->
    <script src="Scritp.js"></script>

</body>

</html>
